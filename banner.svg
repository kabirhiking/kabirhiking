<svg width="100%" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#07192f"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38ef7d" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#11998e" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background card with glowing border -->
  <rect x="2" y="2" width="996" height="216" rx="16" fill="url(#bgGrad)" stroke="url(#textGrad)" stroke-width="2" />

  <!-- Background Cyberpunk Grid accents -->
  <g opacity="0.12" stroke="#00f2fe" stroke-width="1">
    <line x1="0" y1="40" x2="1000" y2="40" />
    <line x1="0" y1="80" x2="1000" y2="80" />
    <line x1="0" y1="120" x2="1000" y2="120" />
    <line x1="0" y1="160" x2="1000" y2="160" />
    <line x1="0" y1="200" x2="1000" y2="200" />
    <line x1="200" y1="0" x2="200" y2="220" />
    <line x1="400" y1="0" x2="400" y2="220" />
    <line x1="600" y1="0" x2="600" y2="220" />
    <line x1="800" y1="0" x2="800" y2="220" />
  </g>

  <!-- Terminal Header Dots -->
  <circle cx="30" cy="30" r="6" fill="#ff5f56" />
  <circle cx="50" cy="30" r="6" fill="#ffbd2e" />
  <circle cx="70" cy="30" r="6" fill="#27c93f" />

  <!-- Decorative Corner Brackets -->
  <path d="M 20 60 L 20 40 L 40 40" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 980 60 L 980 40 L 960 40" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 20 160 L 20 180 L 40 180" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M 980 160 L 980 180 L 960 180" stroke="#00f2fe" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- Main Name Title -->
  <text x="500" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="url(#textGrad)" filter="url(#glow)">
    Raihan Kabir
  </text>
  <text x="500" y="105" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#ffffff">
    Raihan Kabir
  </text>

  <!-- Subtitle -->
  <text x="500" y="150" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#70a5fd" letter-spacing="2">
    Software Engineer | Full Stack &amp; Backend Architect
  </text>

  <!-- Bottom Accent Bar -->
  <rect x="350" y="175" width="300" height="3" rx="1.5" fill="url(#textGrad)" />
</svg>
